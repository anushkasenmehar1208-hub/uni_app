<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }

        .container {
            text-align: center;
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            color: white;
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
        }

        .avatar-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin: 20px auto;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.2);
            overflow: hidden;
        }

        #alex-orb {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .orb-visual {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(100,200,255,0.6), rgba(50,100,200,0.3));
            box-shadow: inset -2px -2px 8px rgba(0,0,0,0.3), 0 0 30px rgba(100,200,255,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: rgba(255,255,255,0.7);
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(255,255,255,0.3);
            border-color: rgba(255,255,255,0.6);
        }

        button:active {
            transform: scale(0.95);
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            font-size: 14px;
            font-family: monospace;
            min-height: 60px;
            text-align: left;
            color: #00ff00;
        }

        .log-entry {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Alex 3D Avatar Test</h1>
        <p>Testing avatar loading and animation</p>

        <div class="avatar-container">
            <div id="alex-orb">
                <div class="orb-visual">
                    Avatar loading...
                </div>
            </div>
        </div>

        <div class="controls">
            <button onclick="simulateAISpeaking()">AI Speaking</button>
            <button onclick="simulateUserSpeaking()">User Speaking</button>
            <button onclick="simulateThinking()">Thinking</button>
            <button onclick="simulateIdle()">Idle</button>
            <button onclick="testAudio()">Test Audio</button>
        </div>

        <div class="status" id="status">
            <div class="log-entry">[Ready] Click buttons to test states</div>
        </div>
    </div>

    <!-- Load avatar script -->
    <script>
      (function () {
        var s = document.createElement('script');
        s.src = 'assets/alex_avatar.js?v=' + Date.now();
        document.currentScript.parentNode.insertBefore(s, document.currentScript.nextSibling);
      })();
    </script>

    <script>
        const statusEl = document.getElementById('status');
        let logCount = 0;

        function addLog(message) {
            logCount++;
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            statusEl.appendChild(entry);

            // Keep only last 10 entries
            while (statusEl.children.length > 10) {
                statusEl.removeChild(statusEl.firstChild);
            }
            statusEl.scrollTop = statusEl.scrollHeight;
        }

        function simulateAISpeaking() {
            const orb = document.getElementById('alex-orb');
            orb.className = 'ai-speaking';
            addLog('State → AI Speaking');
        }

        function simulateUserSpeaking() {
            const orb = document.getElementById('alex-orb');
            orb.className = 'user-speaking';
            addLog('State → User Speaking');
        }

        function simulateThinking() {
            const orb = document.getElementById('alex-orb');
            orb.className = 'thinking';
            addLog('State → Thinking');
        }

        function simulateIdle() {
            const orb = document.getElementById('alex-orb');
            orb.className = '';
            addLog('State → Idle');
        }

        function testAudio() {
            addLog('Audio test: Creating test tone...');
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.frequency.value = 440;
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);

                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 1);

                // Change to AI Speaking during audio
                simulateAISpeaking();
                setTimeout(simulateIdle, 1000);
                addLog('Audio test: Playing 440Hz tone for 1 second');
            } catch (e) {
                addLog(`Audio test failed: ${e.message}`);
            }
        }

        // Monitor avatar initialization
        window.addEventListener('AlexAvatarInit', (e) => {
            addLog('✓ AlexAvatar initialized');
        });

        window.addEventListener('AlexAvatarError', (e) => {
            addLog(`✗ Avatar error: ${e.detail || e.message}`);
        });

        // Log initial state
        setTimeout(() => {
            if (window.AlexAvatar) {
                addLog('✓ AlexAvatar available');
                addLog(`  WebGL: ${window.AlexAvatar.capabilities?.webgl ? 'YES' : 'NO'}`);
            } else {
                addLog('⚠ AlexAvatar not loaded yet');
            }
        }, 500);
    </script>
</body>
</html>
